version: "3.9"

services:
  php:
    build:
      context: ./.docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
      - ./web/app/uploads:/var/www/html/web/app/uploads
      - ./.docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini:ro
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      - db
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /var/www/html/web/app/cache/acorn && touch /var/www/html/web/app/debug.log && chown -R www-data:www-data /var/www/html/web/app/uploads /var/www/html/web/app/cache /var/www/html/web/app/debug.log && docker-php-entrypoint php-fpm"

  nginx:
    image: nginx:1.25
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./:/var/www/html
      - ./web/app/uploads:/var/www/html/web/app/uploads
      - ./.docker/nginx/bedrock.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/nginx/localdev.crt:/etc/nginx/ssl/localdev.crt:ro
      - ./.docker/nginx/localdev.key:/etc/nginx/ssl/localdev.key:ro
    depends_on:
      - php
    restart: unless-stopped

  db:
    image: mariadb:11.8
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --skip-ssl
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  composer:
    image: composer:2
    # Runs as the host user so installed packages are not root owned on a Linux or WSL filesystem.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: [ "composer" ]
    # Usage: docker compose run --rm composer install

  wpcli:
    image: wordpress:cli-2.12-php8.4
    # Same uid as PHP-FPM's www-data, which owns uploads, cache and debug.log.
    user: "33:33"
    environment:
      HOME: /tmp
    volumes:
      - ./:/var/www/html
      - ./.docker/wpcli/mariadb:/usr/local/bin/mariadb:ro
      - ./.docker/wpcli/mariadb-dump:/usr/local/bin/mariadb-dump:ro
    working_dir: /var/www/html
    entrypoint: [ "wp" ]
    # Usage: docker compose run --rm wpcli core install ...

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILHOG_WEB_PORT:-8025}:8025" # UI
    restart: unless-stopped

volumes:
  db_data:
